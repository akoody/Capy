# Пример: подставь свой домен и путь к проекту (где лежит frontend/dist после npm run build).
# Статика — из СВЕЖЕГО frontend/dist; /api — на Nest (pm2, порт 3001).

server {
    listen 443 ssl http2;
    server_name your-domain.example;

    # При «500 в приложении, а в pm2 пусто» сначала смотрите: tail -f /var/log/nginx/error.log
    # (часто upstream timeout / connect() failed / client closed).

    # ssl_certificate ...;

    # АБСОЛЮТНЫЙ путь к актуальной сборке фронта:
    root /var/www/capy/capy/capy/frontend/dist;
    index index.html;

    # Не кешировать главную страницу — иначе Telegram держит старый index.html со старыми именами .js
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Загрузка аудио для голоса; по умолчанию nginx режет тело ~1m → 413 и voice_request_failed
    client_max_body_size 25m;

    # После certbot часто два server {} (80 и 443) — блок /api/ и Authorization должны быть в ОБОИХ (или только в том, куда реально попадают запросы).
    location /api/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
